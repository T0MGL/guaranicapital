<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, hreflang, OG and Twitter are written per
         language from src/i18n/locales.ts: by scripts/prerender.mjs for the
         three files the build emits, and by the dev server for the language
         being requested. Nothing between these markers is ever served, so do
         not add metadata here, add it there. The title is a placeholder for the
         window between vite build and the prerender step. -->
    <!--seo:start-->
    <title>Guaraní Capital</title>
    <!--seo:end-->

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Everything the first viewport needs is on this origin and requested up
         front. The hero paints from the markup below, not from the bundle. -->
    <link rel="preload" as="image" href="/hero/hero-poster.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />

    <!--@hero-critical-css-->
  </head>
  <body>
    <!--hero:start--><!--@hero-boot--><!--hero:end-->
    <div id="root"></div>
    <!--@hero-boot-script-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
